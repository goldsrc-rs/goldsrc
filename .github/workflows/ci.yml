name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-markdown:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Verify Documentation Files Exist
        run: |
          test -f README.md
          test -f ECOSYSTEM_BLUEPRINT.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md

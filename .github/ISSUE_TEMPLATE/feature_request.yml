name: "Feature Request"
description: "Propose an architectural enhancement or feature"
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Motivation
      description: What challenge or requirement does this address?
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Proposed Design / Solution
      description: Detail API contracts, memory layout, and implementation rationale.
    validations:
      required: true

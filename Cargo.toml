[workspace]
members = [
    "crates/goldsrc",
    "crates/grs",
]
resolver = "3"

[workspace.package]
version = "0.20.0"
edition = "2024"
authors = ["GoldSrc.rs Team"]
description = "Next-generation GoldSrc technical platform, facade meta-crate, developer CLI, and architecture hub"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goldsrc-rs/goldsrc"

[workspace.dependencies]
goldsrc-api = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
goldsrc-spi = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
goldsrc-macros = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
goldsrc-sys = { git = "https://github.com/goldsrc-rs/goldsrc-sdk.git", branch = "dev" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
stitch-cli = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main" }
stitch-core = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main" }
stitch-macros = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main" }
stitch-rs = { git = "https://github.com/ulquiorracode/stitch-rs.git", branch = "main" }

[profile.dev]
opt-level = 0
debug = 1
overflow-checks = true

[profile.release]
lto = "thin"
opt-level = "z"
strip = "debuginfo"
panic = "unwind"
overflow-checks = true

[patch."https://github.com/goldsrc-rs/goldsrc-sdk.git"]
goldsrc-api = { path = "../goldsrc-sdk-core/goldsrc-api" }
goldsrc-spi = { path = "../goldsrc-sdk-core/goldsrc-spi" }
goldsrc-macros = { path = "../goldsrc-sdk-core/goldsrc-macros" }
goldsrc-sys = { path = "../goldsrc-sdk-core/goldsrc-sys" }

[patch."https://github.com/ulquiorracode/stitch-rs.git"]
stitch-cli = { path = "../../stitch-rs/crates/stitch-cli" }
stitch-core = { path = "../../stitch-rs/crates/stitch-core" }
stitch-macros = { path = "../../stitch-rs/crates/stitch-macros" }
stitch-rs = { path = "../../stitch-rs" }

